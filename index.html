<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>もぐログ</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <button class="chrome-toggle" type="button" id="chromeToggle" aria-expanded="true">
      上の画面を隠す
    </button>

    <header class="app-header" id="appHeader">
      <div>
        <p class="eyebrow">Mogu Log</p>
        <h1>もぐログ</h1>
      </div>
      <div class="header-actions">
        <button class="header-button" type="button" id="focusPostButton">投稿する</button>
        <button class="header-button soft" type="button" id="focusDeleteButton">削除する</button>
        <label class="sound-switch" title="効果音のオン・オフ">
          <input id="soundToggle" type="checkbox" />
          <span>効果音</span>
        </label>
      </div>
    </header>

    <main class="shell">
      <aside class="app-nav" aria-label="メインメニュー">
        <button class="nav-button is-active" type="button" data-jump="feed" title="投稿一覧">⌂</button>
        <button class="nav-button" type="button" data-jump="composer" title="投稿する">＋</button>
        <button class="nav-button" type="button" data-jump="search" title="検索">⌕</button>
        <button class="nav-button" type="button" data-jump="settings" title="設定">♪</button>
      </aside>

      <section class="intro">
        <div>
          <p class="eyebrow">Mogu Moment</p>
          <h2>おいしかった瞬間を、写真つきで気軽に残そう。</h2>
          <p>
            投稿前に画像を確認して、明るさや色味を少し整えてから投稿できます。
            位置情報を付けたり、気に入った投稿を「もぐもぐ」できます。
          </p>
        </div>
        <div class="intro-counter">
          <strong id="postCount">0</strong>
          <span>件の投稿</span>
        </div>
      </section>

      <section class="composer" id="composer" aria-label="ごはんを投稿する">
        <div class="section-heading">
          <p class="eyebrow">Post</p>
          <h2>投稿する</h2>
        </div>

        <form id="postForm">
          <label>
            写真を選ぶ
            <input id="photoInput" type="file" accept="image/*" />
          </label>

          <label>
            タイトル
            <input id="titleInput" type="text" placeholder="例: ふわふわ卵のオムライス" required />
          </label>

          <label class="wide">
            コメント
            <textarea id="descriptionInput" placeholder="味、場所、また食べたいポイントなど" required></textarea>
          </label>

          <div class="location-toggle wide">
            <label class="switch-row">
              <input id="locationToggle" type="checkbox" />
              <span>位置情報を付ける</span>
            </label>
            <small>お店の名前だけでもOKです。現在地ボタンを押すと地図リンクも付きます。</small>
          </div>

          <div class="location-fields wide" id="locationFields" hidden>
            <label>
              お店・場所の名前
              <input id="shopNameInput" type="text" placeholder="例: 駅前の定食屋さん" />
            </label>
            <div class="location-actions">
              <button class="secondary-button" type="button" id="getLocationButton">現在地を取得</button>
              <span id="locationStatus">位置情報はまだ取得していません。</span>
            </div>
          </div>

          <div class="image-editor wide" id="imageEditor" hidden>
            <div class="preview-frame">
              <canvas id="previewCanvas" width="900" height="675" aria-label="投稿画像のプレビュー"></canvas>
            </div>
            <div class="editor-controls">
              <label>
                明るさ
                <input id="brightnessInput" type="range" min="70" max="130" value="100" />
              </label>
              <label>
                くっきり
                <input id="contrastInput" type="range" min="70" max="140" value="105" />
              </label>
              <label>
                彩度
                <input id="saturationInput" type="range" min="60" max="150" value="110" />
              </label>
              <label>
                あたたかさ
                <input id="warmthInput" type="range" min="0" max="40" value="10" />
              </label>
              <div class="editor-buttons">
                <button class="secondary-button" type="button" id="rotateButton">回転</button>
                <button class="secondary-button" type="button" id="resetImageButton">リセット</button>
              </div>
            </div>
          </div>

          <button class="primary-button" type="submit">投稿する</button>
        </form>
      </section>

      <section class="feed-section" id="feedSection" aria-label="投稿一覧">
        <div class="section-heading feed-heading">
          <div>
            <p class="eyebrow">Timeline</p>
            <h2>投稿一覧</h2>
          </div>
          <label class="search-box" id="searchBox">
            <span>検索</span>
            <input id="searchInput" type="search" placeholder="料理名・コメント・場所で探す" />
          </label>
        </div>

        <div class="feed" id="feed"></div>
        <p class="empty-state" id="emptyState" hidden>まだ表示できる投稿がありません。</p>
      </section>

      <section class="settings" id="settingsSection" aria-label="設定">
        <div class="section-heading">
          <p class="eyebrow">Settings</p>
          <h2>設定</h2>
        </div>
        <div class="settings-grid">
          <label class="setting-card">
            <input id="soundTogglePanel" type="checkbox" />
            <span>
              <strong>効果音</strong>
              <small>いいね、もぐもぐ、投稿のときに小さな音を鳴らします。</small>
            </span>
          </label>
          <button class="setting-card button-card" type="button" id="chromeTogglePanel">
            <strong>上の画面を隠す/表示</strong>
            <small>「もぐログ」「投稿する」「削除する」のバーを切り替えます。</small>
          </button>
        </div>
      </section>
    </main>

    <template id="postTemplate">
      <article class="post-card">
        <img class="post-image" alt="" />
        <div class="post-body">
          <div class="post-meta">
            <span class="author">mogu</span>
            <span class="time"></span>
          </div>
          <h3></h3>
          <p></p>
          <div class="post-location" hidden>
            <strong class="shop-name"></strong>
            <a class="map-link" href="#" target="_blank" rel="noreferrer">地図を見る</a>
          </div>
          <div class="post-actions">
            <button class="like-button" type="button" aria-label="いいねする">
              <span class="heart">♡</span>
              <span class="like-count">0</span>
            </button>
            <button class="boost-button" type="button" aria-label="もぐもぐする">
              <span>🍚</span>
              <span class="boost-count">0</span>
            </button>
            <button class="share-button" type="button">共有</button>
            <button class="delete-button" type="button">削除</button>
          </div>
        </div>
      </article>
    </template>

    <script src="app.js"></script>
  </body>
</html>
